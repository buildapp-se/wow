name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Legacy-byggena måste gå att köpa i spelet och noindex måste finnas, annars ska sidan inte ut.
      - run: node site/test.mjs
      - run: rm site/test.mjs
      # Assets cachas i 4 h: ny adress vid varje deploy, så att HTML och JS aldrig blandas.
      - run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" site/index.html site/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
